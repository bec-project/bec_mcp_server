name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff and Pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting
        run: |
          ruff check .
          ruff format --check --diff .

      - name: Run Pylint
        run: pylint bec_mcp_server

  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest --random-order -v tests/

  e2e:
    name: End-to-end against BEC 4 services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Install package with the BEC services and the e2e plugin
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"

      - name: Run end-to-end tests
        run: |
          mkdir -p /tmp/bec-e2e
          python -m pytest -v --timeout 600 --start-servers --files-path /tmp/bec-e2e tests/e2e

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check that the wheel ships only the package
        run: |
          wheel=$(ls dist/*.whl)
          unzip -Z1 "$wheel"
          unexpected=$(unzip -Z1 "$wheel" | grep -v -e '^bec_mcp_server/' -e '^bec_mcp_server-[^/]*\.dist-info/' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::wheel ships files outside the package: $unexpected"
            exit 1
          fi

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/bec-mcp-server --help
