[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bec-mcp-server"
version = "0.1.0"
description = "A very small MCP server for inspecting BEC state"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bec-lib>=3.0",
  "mcp>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
bec-mcp-server = "bec_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
